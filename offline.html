<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffcf5">
  <meta name="robots" content="noindex">
  <title>接続を確認してください｜ちみHub</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #fffcf5; color: #4f3b2d; font: 16px/1.8 system-ui, sans-serif; }
    main { width: min(100%, 520px); padding: 28px; border: 1.75px solid; border-radius: 24px; background: white; box-shadow: 6px 6px 0 #4f3b2d; }
    h1 { font-size: 1.5rem; }
    button, a { color: inherit; font: inherit; }
    button { padding: 12px 20px; border: 1.75px solid; border-radius: 10px; background: #f3b75b; cursor: pointer; }
    a { display: inline-block; margin: 16px 0 0; }
  </style>
</head>
<body>
  <main>
    <p>ちみっこHub</p>
    <h1>接続を確認してください</h1>
    <p>ちみHubの閲覧・ログイン・保存にはインターネット接続が必要です。接続を確認して、もう一度お試しください。</p>
    <p>この画面では投稿の閲覧や編集はできません。</p>
    <button type="button" onclick="location.reload()">もう一度読み込む</button><br>
    <a href="/">トップへ戻る</a>
  </main>
</body>
</html>
